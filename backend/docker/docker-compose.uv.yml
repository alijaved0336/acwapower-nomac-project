services:
  # Django Application Service with UV-based build
  django:
    build:
      context: ..
      dockerfile: docker/Dockerfile.uv
      cache_from:
        - ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    image: swro-backend:uv-latest
    container_name: swro-django
    ports:
      - "8000:8000"

    env_file:
      - ../.env  # Load ALL environment variables from .env file
    environment:
      # Override container-specific configurations ONLY
      # These override .env file values for Docker networking

      # Redis Configuration (Container network - override .env)
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      # ClickHouse Configuration (Container network - override .env)
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=default
      - CLICKHOUSE_DATABASE=swro_monitoring
      - CLICKHOUSE_SECURE=0

      # PySpark Configuration for containers
      - SPARK_LOCAL_DIRS=/tmp/spark
      - SPARK_SQL_ADAPTIVE_ENABLED=true
      - SPARK_SQL_ADAPTIVE_COALESCE_PARTITIONS_ENABLED=true
      - SPARK_EXECUTOR_MEMORY=1g
      - SPARK_DRIVER_MEMORY=512m

      # Docker container indicator
      - DOCKER_CONTAINER=1

      # Enable auto-reload for development
      - DJANGO_SETTINGS_MODULE=nomac.settings


    volumes:
      # Mount source code for live development (changes sync automatically)
      - ..:/app
      # Keep these as named volumes to avoid permission issues
      - django_static:/app/staticfiles
      - django_logs:/app/logs
      - django_data:/app/data
      # Exclude .venv to use container's Python packages
      - /app/.venv
    networks:
      - swro-network
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Override entrypoint for development (volume mount overwrites container files)
    entrypoint: []
    # Override CMD for development
    command: bash -c "python manage.py collectstatic --noinput && gunicorn nomac.wsgi:application --config=/app/gunicorn_conf.py"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 100s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ClickHouse Database Service (simplified)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native protocol

    environment:
      # ClickHouse specific configuration - simplified for development
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - swro-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "default", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6380:6379"  # Avoid conflict with local Redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - swro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  clickhouse_data:
    driver: local
  redis_data:
    driver: local
  django_static:
    driver: local
  django_logs:
    driver: local
  django_data:
    driver: local

networks:
  swro-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16