[project]
name = "swro-backend"
version = "1.0.0"
description = "SWRO Backend Django REST Framework application with PySpark integration"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "SWRO Team", email = "team@swro.com"},
]
keywords = ["django", "rest-framework", "pyspark", "azure", "clickhouse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Django Core
    "Django==5.2.4",
    "djangorestframework==3.16.0",
    "gunicorn==23.0.0",

    # Data Processing
    "pyspark==4.0.0",
    "delta-spark==4.0.0",
    "pyarrow==21.0.0",
    "deltalake==1.1.4",

    # API Documentation
    "drf-yasg==1.21.10",

    # CORS and Security
    "django-cors-headers==4.7.0",

    # Caching
    "django-redis==6.0.0",
    "redis==6.4.0",

    # Authentication
    "PyJWT==2.10.1",

    # Configuration
    "python-dotenv==1.1.1",

    # Logging
    "python-json-logger==3.3.0",

    # Static Files
    "whitenoise==6.8.2",

    # Azure Services
    "azure-storage-blob==12.19.0",
    "azure-storage-file-datalake==12.14.0",
    "azure-identity==1.15.0",

    # Databricks
    "databricks-sdk==0.63.0",
    "databricks-sql-connector==4.0.5",

    # ClickHouse
    "clickhouse-connect>=0.7.0",

    # Scheduling
    "APScheduler==3.10.4",
]

[project.optional-dependencies]
dev = [
    # Development Tools
    "debugpy==1.8.7",
    "ipython==8.30.0",
    "ipdb==0.13.13",
    "django-extensions==3.2.3",
    "werkzeug==3.1.3",

    # Testing
    "pytest==8.3.4",
    "pytest-django==4.9.0",
    "pytest-cov==6.0.0",
    "factory-boy==3.3.1",

    # Code Quality
    "black==25.1.0",
    "isort==6.0.1",
    "flake8==7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "debugpy>=1.8.7",
    "ipython>=8.30.0",
    "ipdb>=0.13.13",
    "django-extensions>=3.2.3",
    "werkzeug>=3.1.3",
    "pytest>=8.3.4",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "factory-boy>=3.3.1",
    "black>=25.1.0",
    "isort>=6.0.1",
    "flake8>=7.3.0",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "nomac.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--tb=short --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
source = "."
omit = [
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "manage.py",
    "*/settings/*",
    "*/tests/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false